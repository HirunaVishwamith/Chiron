name: RISC-V OOO Core CI

# Run ONCE per commit, named after the commit (not the branch/PR).
#   - push only (all branches): exactly one run per push. We deliberately do
#     NOT add a `pull_request` trigger — with both, a push to a branch that
#     has an open PR fires twice. push-only also makes the run title default
#     to the commit message instead of the PR title (e.g. "Linux build").
on:
  push:
    branches: ['**']

# Title each run after the pushed commit's message rather than the branch name.
run-name: ${{ github.event.head_commit.message }}

# Cancel an in-progress run when a newer commit supersedes it (same ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned to 22.04: its apt `verilator` is 4.038, which matches the internal
    # signal naming (system__DOT__memory__DOT__memory) that sim/rtl/rtl_model.h
    # relies on. ubuntu-latest ships Verilator 5.x, which renames that internal
    # and breaks the lockstep-harness build.
    runs-on: ubuntu-22.04

    env:
      SBT_OPTS: "-Xmx4G -Xss2M"

    steps:
    # =========================
    # Checkout repo
    # =========================
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # JDK 17 (sbt 2.x requires JDK 17+; ubuntu-22.04 defaults to JDK 11)
    # =========================
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # =========================
    # System dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator libfl2 libfl-dev zlib1g-dev

    # =========================
    # Fix Verilator strict warning (EOF newline)
    # =========================
    - name: Fix Verilog formatting issues
      run: |
        find . -name "iCacheRegisters.v" -exec sed -i -e '$a\' {} \;

    # =========================
    # Install SBT safely (Updated Key & Quotes)
    # =========================
    - name: Install SBT
      run: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" \
          | sudo gpg --dearmor -o /etc/apt/keyrings/scalasbt.gpg

        echo "deb [signed-by=/etc/apt/keyrings/scalasbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" \
          | sudo tee /etc/apt/sources.list.d/sbt.list

        sudo apt-get update
        sudo apt-get install -y sbt

    # =========================
    # Cache SBT (important for speed)
    # =========================
    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}

    # =========================
    # Clean build
    # =========================
    - name: Clean
      run: make clean

    # =========================
    # Build RTL from Scala (traced model, used by the ISA lockstep suite)
    # =========================
    - name: Build RTL (SBT + Verilator flow)
      run: make sim

    # =========================
    # Run lockstep smoke test
    # Non-blocking: failure is reported but does not fail CI.
    # =========================
    - name: Run Lockstep (smoke test)
      continue-on-error: true
      run: make runLockStep

    # =========================
    # ISA regression suite (gate: >= 83/84 -- fence_i is a known miss on the
    # current stable D-cache; see mk/run.mk test_all_images).
    # =========================
    - name: Run full ISA test suite
      run: make test_all_images

    # =========================
    # Build the fast no-trace model (reuses the system.v from `make sim`) for
    # the quad-core benchmark gate.
    # =========================
    - name: Build fast RTL model
      run: make sim-fast

    # =========================
    # Quad-core benchmark gate: the 5 max-scale q4 benchmarks must all complete.
    # =========================
    - name: Run quad-core benchmark suite
      run: make ci-bench

    # =========================
    # Upload results
    # =========================
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: riscv-test-results
        path: |
          test_results.txt
          run.log
