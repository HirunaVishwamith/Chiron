name: generic tests

# Run ONCE per commit, named after the commit (not the branch/PR).
#   - push only (all branches): exactly one run per push. We deliberately do
#     NOT add a `pull_request` trigger — with both, a push to a branch that
#     has an open PR fires twice. push-only also makes the run title default
#     to the commit message instead of the PR title (e.g. "Linux build").
on:
  push:
    branches: ['**']

# Title each run after the pushed commit's message rather than the branch name.
run-name: ${{ github.event.head_commit.message }}

# Cancel an in-progress run when a newer commit supersedes it (same ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned to 22.04: its apt `verilator` is 4.038, which matches the internal
    # signal naming (system__DOT__memory__DOT__memory) that sim/rtl/rtl_model.h
    # relies on. ubuntu-latest ships Verilator 5.x, which renames that internal
    # and breaks the lockstep-harness build.
    runs-on: ubuntu-22.04

    env:
      SBT_OPTS: "-Xmx4G -Xss2M"

    steps:
    # =========================
    # Checkout repo
    # =========================
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # JDK 17 (sbt 2.x requires JDK 17+; ubuntu-22.04 defaults to JDK 11)
    # =========================
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # =========================
    # System dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt-get update
        # Pin 4.038: ubuntu-22.04's apt package. 5.x renames internal nets
        # (rtl_model.h) and its default timing-eval is much slower.
        sudo apt-get install -y verilator=4.038-1 libfl2 libfl-dev zlib1g-dev
        echo "nproc=$(nproc)  verilator=$(verilator --version)"

    # =========================
    # Fix Verilator strict warning (EOF newline)
    # =========================
    - name: Fix Verilog formatting issues
      run: |
        find . -name "iCacheRegisters.v" -exec sed -i -e '$a\' {} \;

    # =========================
    # Install SBT safely (Updated Key & Quotes)
    # =========================
    - name: Install SBT
      run: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" \
          | sudo gpg --dearmor -o /etc/apt/keyrings/scalasbt.gpg

        echo "deb [signed-by=/etc/apt/keyrings/scalasbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" \
          | sudo tee /etc/apt/sources.list.d/sbt.list

        sudo apt-get update
        sudo apt-get install -y sbt

    # =========================
    # Cache SBT (important for speed)
    # =========================
    - name: Cache SBT
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
        key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}

    # =========================
    # Clean build
    # =========================
    - name: Clean
      run: make clean

    # =========================
    # Build RTL from Scala (traced model, used by the ISA lockstep suite)
    # =========================
    - name: Build RTL (SBT + Verilator flow)
      run: |
        CORES=$(nproc); [ "$CORES" -ge 2 ] || CORES=2
        echo "using VJOBS=$CORES"
        make sim VJOBS=$CORES

    # =========================
    # Run lockstep smoke test (now a hard gate)
    # Any register mismatch (e.g. x14), timeout, or "Test failed" will cause CI to fail.
    # If the mt-vvadd-s1.bin (or other smoke bin) causes persistent mismatch with current RTL,
    # regenerate/rebuild the benchmark binary (e.g. via make in sim/ or test image generation)
    # and commit the updated .bin so it matches the RTL + fence.i behavior.
    # =========================
    - name: Run Lockstep (smoke test)
      run: make runLockStep

    # =========================
    # ISA regression suite
    # Gate is now strict: ANY FAIL (incl. rv64ui-p-fence_i.bin) or Register mismatch
    # will fail the CI. Previously it tolerated fence_i as "known miss".
    # Fix fence.i in RTL/D-cache (or test harness) so the ISA suite passes cleanly.
    # =========================
    - name: Run full ISA test suite
      run: make test_all_images

    - name: Verify ISA suite has no FAILs or register mismatches
      run: |
        echo "Verifying ISA test results..."
        FAILED=0
        # test_all_images writes lowercase "<name>: fail" for any failing image.
        if [ -f test_results.txt ] && grep -qiE ': fail' test_results.txt; then
          echo "::error::ISA suite reported a FAIL (e.g. fence_i or other). Full results:"
          cat test_results.txt || true
          FAILED=1
        fi
        # Any register mismatch captured by the lockstep smoke step.
        if grep -qi "Register mismatch" lockstep_smoke.log run.log 2>/dev/null; then
          echo "::error::Register mismatch detected in lockstep/ISA run"
          FAILED=1
        fi
        if [ $FAILED -eq 1 ]; then
          echo "Failing CI due to ISA failures or mismatches as requested."
          exit 1
        fi
        echo "ISA suite passed with no FAILs and no register mismatches."

    # =========================
    # Build the fast no-trace model (reuses the system.v from `make sim`) for
    # the quad-core benchmark gate.
    # =========================
    - name: Build fast RTL model
      run: |
        CORES=$(nproc); [ "$CORES" -ge 2 ] || CORES=2
        make sim-fast VJOBS=$CORES

    # =========================
    # Quad-core benchmark gate: the 5 max-scale q4 benchmarks must all complete.
    # Now also fails CI on any "Register mismatch" or failure indicators from fast model / bench.
    # =========================
    - name: Run quad-core benchmark suite
      run: |
        CORES=$(nproc); [ "$CORES" -ge 2 ] || CORES=2
        make ci-bench CI_JOBS=$CORES

    - name: Verify quad-core / fast RTL benchmark has no mismatches or failures
      run: |
        echo "Verifying quad-core benchmark results..."
        # ci-bench appends "<bench>: fail" to test_results.txt for any benchmark
        # that did not reach BENCHMARK COMPLETE or that reported a mismatch/deadlock.
        if grep -qiE ': fail' test_results.txt 2>/dev/null; then
          echo "::error::A quad-core benchmark (or the fast RTL model) failed. Full results:"
          cat test_results.txt || true
          exit 1
        fi
        echo "Quad-core benchmarks and fast RTL model passed without register mismatches or failures."

    # =========================
    # Microarchitectural assertion gate.
    #
    # ci-bench above asks "did the benchmark produce the right answer?".
    # This asks the stricter question: "did the microarchitecture stay
    # self-consistent while it did?" Four separate wedges in this design were
    # caused by a completion landing on a ROB slot that speculation had already
    # reallocated -- each corrupted state silently for millions of cycles before
    # anything visibly hung, and ci-bench passed straight through some of them.
    # sim/harness/invariants.h asserts the invariants they violated on every
    # cycle; a violation fails the run even when the benchmark still computed
    # the right result.
    #
    # Runs on the same committed bins/ as ci-bench, so it needs no RISC-V
    # toolchain. It is slower (it reads all 16 ROB ready bits per core per
    # cycle), which is why it is a separate binary and a separate step rather
    # than a flag on the profiling one.
    #
    # NOT included here: `make stress-sweep` (seeded constrained-random
    # speculation stress). It compiles generated C and therefore needs
    # riscv64-unknown-elf-gcc, which this workflow deliberately does not
    # install. To add it, install the toolchain and append e.g.
    #   make stress-sweep STRESS_SEEDS="1 2 3 4" BLOCKS=200
    # keeping the seed list short -- each seed is a full RTL simulation.
    # =========================
    - name: Run microarchitectural assertion gate
      run: |
        CORES=$(nproc); [ "$CORES" -ge 2 ] || CORES=2
        make ci-check CI_JOBS=$CORES

    # =========================
    # Upload results (always, even if previous steps failed, for debugging)
    # =========================
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: riscv-test-results
        path: |
          test_results.txt
          run.log
          lockstep_smoke.log
          *.log
        retention-days: 7
